# ═══════════════════════════════════════════════════════════════
# GITA 365 — Lấy báo cáo Soát toàn bộ màn (CHỈ BẢN MÃ)
#
# Super Admin chạy "Soát toàn bộ màn" trong app; báo cáo được mã hoá ngay
# trong trình duyệt (AES-256-GCM bọc RSA-OAEP-3072, khoá công khai ở
# src/khoa-soat.js) rồi cất ở máy chủ. Workflow này chỉ CHUYỂN bản mã ấy
# sang nhánh dữ liệu riêng `bao-cao-soat` (một commit, không lịch sử) để
# người giữ khoá riêng lấy bằng git rồi XOÁ nhánh. Kho mã công khai nên
# workflow KIỂM trước khi đẩy: gói phải đúng khuôn bản mã, không một
# trường đọc được nào ngoài thời điểm và số màn.
# Không dùng secret nào: cửa layBaoCaoSoat chỉ trả bản mã; quyền đẩy là
# token tự cấp của chính lượt chạy, chỉ ghi được vào nhánh bao-cao-soat.
# ═══════════════════════════════════════════════════════════════
name: Lấy báo cáo soát toàn màn (bản mã)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lay-bao-cao-soat
  cancel-in-progress: false

jobs:
  lay:
    runs-on: ubuntu-latest
    # Quyền ghi chỉ ở job này (đẩy nhánh bao-cao-soat), không ở cả quy trình.
    permissions:
      contents: write
    steps:
      - name: Lấy bản mã mới nhất từ máy chủ
        run: |
          set -eu
          ma=$(curl -sS --max-time 30 -o tra.json -w '%{http_code}' -X POST "https://gita365.typhuquanggita.workers.dev/" \
            -H 'Content-Type: text/plain;charset=utf-8' --data '{"fn":"layBaoCaoSoat"}' || echo 000)
          if [ "$ma" != "200" ]; then echo "::error::Máy chủ trả HTTP $ma"; exit 1; fi
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('tra.json', 'utf8'));
          // Chữ từ máy chủ không được mang dòng mới hay "::" — nếu không, một phản hồi
          // bị sửa có thể chèn lệnh điều khiển runner của GitHub Actions.
          const sach = x => String(x).replace(/[\r\n]+/g, ' ').replace(/::/g, ': :').slice(0, 300);
          const loi = m => { console.log('::error::' + sach(m)); process.exit(1); };
          if (!r.ok) loi('Máy chủ trả lỗi: ' + (r.error || '?'));
          if (r.trong) loi('Chưa có báo cáo nào trong 14 ngày — Super Admin bấm "Gửi bản mã hoá" ở màn Soát toàn bộ màn trước.');
          const g = JSON.parse(r.goi);
          const B64 = /^[A-Za-z0-9+/]+={0,2}$/;
          const dung = Object.keys(g).sort().join(',') === 'd,dv,iv,k,v,z' && g.v === 1 && /^[0-9a-f]{16}$/.test(g.dv) &&
            g.k.length === 512 && B64.test(g.k) && g.iv.length === 16 && B64.test(g.iv) && B64.test(g.d);
          if (!dung) loi('Gói không đúng khuôn bản mã — không đẩy.');
          fs.mkdirSync('ra', { recursive: true });
          fs.writeFileSync('ra/soat-ban-ma.json', JSON.stringify({ luc: r.luc, so: r.so, goi: g }));
          console.log('::notice::Bản mã lúc ' + sach(r.luc) + ' · ' + sach(r.so) + ' màn · khoá ' + g.dv + ' · ' + Math.round(r.goi.length / 1024) + ' KB');
          NODE
          rm -f tra.json

      - name: Đẩy bản mã sang nhánh dữ liệu bao-cao-soat
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd ra
          git init -q -b bao-cao-soat
          git config user.name "gita-soat-toan-man"
          git config user.email "gita-soat-toan-man@users.noreply.github.com"
          git add soat-ban-ma.json
          git commit -qm "Bản mã báo cáo soát toàn màn"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bao-cao-soat
          echo "::notice::Đã đẩy bản mã sang nhánh bao-cao-soat."
