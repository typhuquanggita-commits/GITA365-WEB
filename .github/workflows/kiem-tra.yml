# Cổng kiểm tra mọi PR/push — đo, không khai.
# Chạy trên mọi nhánh trước khi deploy.yml đưa lên Cloudflare (main).
name: Kiem tra GITA365

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiem-tra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # node:sqlite (thử đồng bộ giả lập) cần Node >= 22.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Bundle khớp src (gop-src --kiem)
        run: node tools/gop-src.js --kiem

      - name: Cú pháp Worker
        run: for f in may-chu/*.js; do node --check "$f"; done

      - name: Rà soát đầy đủ
        run: node tools/ra-soat-day-du.js

      - name: Thử CORS
        run: node tools/thu-cors.mjs

      - name: Thử đồng bộ · ngăn khoang · tự lành (D1/R2 giả lập)
        run: node tools/thu-dong-bo.mjs

      - name: Thử Bộ não đa trí (Điều 13 · đệm · rẻ trước · leo bậc · ngân sách)
        run: node tools/thu-da-tri.mjs

      - name: Thử Cây tiền (KPI 90/90/20 tính từ D1)
        run: node tools/thu-cay-tien.mjs

      - name: Thử ví credit (sổ cái · quyền · thứ tự trừ · khớp app)
        run: node tools/thu-credit.mjs

      - name: Thử đo lường khách hàng (số đo · gom tháng · sáu điểm · phân tầng · quyền · khớp app)
        run: node tools/thu-do-luong.mjs

      - name: Thử Trung tâm đo lường & tối ưu (41 chỉ số · vai · người · kiểm tra · giải pháp · phân bổ · đo lại · khớp app)
        run: node tools/thu-toi-uu.mjs

      - name: Thử Nền tảng chiến lược V20 (Holt · z bền · tách biến động · nhóm khách · LTV/CAC · mục tiêu · khớp app)
        run: node tools/thu-v20.mjs

      - name: Thử Kiến trúc vận hành V50 (bản đồ màn · 14 cụm học thuyết · tự soát áp dụng · quyền · khớp app)
        run: node tools/thu-ap-dung.mjs

      - name: Thử Soát toàn bộ màn (mã hoá trong trình duyệt · khuôn bản mã · chỉ R01 gửi · cửa công khai chỉ trả bản mã)
        run: node tools/thu-soat-man.mjs

      - name: Thử V50·168 (≤168 trang · 15 màn chính · trần màn theo vai · cấp quyền chỉ Super Admin · Coach↔CRM · tài chính & CRM theo giới hạn)
        run: node tools/thu-v50-168.mjs

      - name: Khung dữ liệu CRM · Tài chính khớp lược đồ csdl.sql
        run: node tools/dung-khung-du-lieu.js --kiem

      - name: Thử Truy vấn đa chiều (bốn dòng chảy · bảng điểm 16 ban)
        run: node tools/thu-dong-chay.mjs

      - name: Thử hợp đồng shot xưởng phim (schema + route năng lực + 10 fixture phim thử)
        run: node tools/thu-hop-dong-shot.mjs

      - name: Thử xưởng quay (khớp môi · chuyển động · nhân vật · tts · film · ảnh khóa)
        run: node tools/thu-xuong-quay.mjs

      - name: Thử nhân vật chuẩn được khóa (hồ sơ + bộ phân giải ảnh)
        run: node tools/thu-nhan-vat-chuan.mjs

      - name: Cú pháp máy quay Kaggle (Python)
        run: python3 -m py_compile may-quay-kaggle/quay-kaggle.py may-quay-kaggle/tao-nhan-vat.py may-quay-kaggle/xuong-phim-studio.py

      - name: Thử trang trạng thái công khai (không phiên · chỉ tổng hợp số)
        run: node tools/thu-trang-thai.mjs

      - name: Đo 16 hệ (con trỏ sống · SOP đúng miền · 1000 chiến lược · lá chắn 30 tầng)
        run: node tools/do-16-he.js

      - name: Soát bí mật (không khoá API nào trong repo)
        run: node tools/soat-bi-mat.js

      - name: Kỷ luật kho mã (cửa ↔ nhánh · ES5 · gỡ lỗi sót · .gitignore · giấy phép · gói độc · CSP · action ghim)
        run: node tools/thu-ky-luat.mjs
