# Cổng kiểm tra mọi PR/push — đo, không khai.
# Chạy trên mọi nhánh trước khi deploy.yml đưa lên Cloudflare (main).
name: Kiem tra GITA365

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # deploy.yml gọi lại đúng bộ kiểm này làm CỔNG trước khi triển khai
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow là tên quy trình GỌI: lượt do deploy.yml gọi không huỷ
  # nhầm lượt chạy riêng của chính bộ kiểm trên cùng nhánh (và ngược lại).
  group: kiem-tra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kiem-tra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # node:sqlite (thử đồng bộ giả lập) cần Node >= 22.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Bundle khớp src (gop-src --kiem)
        run: node tools/gop-src.js --kiem

      - name: Cú pháp Worker
        run: for f in may-chu/*.js; do node --check "$f"; done

      - name: Rà soát đầy đủ
        run: node tools/ra-soat-day-du.js

      - name: Thử CORS
        run: node tools/thu-cors.mjs

      - name: Thử đồng bộ · ngăn khoang · tự lành (D1/R2 giả lập)
        run: node tools/thu-dong-bo.mjs

      - name: Thử Bộ não đa trí (Điều 13 · đệm · rẻ trước · leo bậc · ngân sách)
        run: node tools/thu-da-tri.mjs

      - name: Thử Cây tiền (KPI 90/90/20 tính từ D1)
        run: node tools/thu-cay-tien.mjs

      - name: Thử ví credit (sổ cái · quyền · thứ tự trừ · khớp app)
        run: node tools/thu-credit.mjs

      - name: Thử đo lường khách hàng (số đo · gom tháng · sáu điểm · phân tầng · quyền · khớp app)
        run: node tools/thu-do-luong.mjs

      - name: Thử Trung tâm đo lường & tối ưu (41 chỉ số · vai · người · kiểm tra · giải pháp · phân bổ · đo lại · khớp app)
        run: node tools/thu-toi-uu.mjs

      - name: Thử Nền tảng chiến lược V20 (Holt · z bền · tách biến động · nhóm khách · LTV/CAC · mục tiêu · khớp app)
        run: node tools/thu-v20.mjs

      - name: Thử Kiến trúc vận hành V50 (bản đồ màn · 14 cụm học thuyết · tự soát áp dụng · quyền · khớp app)
        run: node tools/thu-ap-dung.mjs

      - name: Thử Soát toàn bộ màn (mã hoá trong trình duyệt · khuôn bản mã · chỉ R01 gửi · cửa công khai chỉ trả bản mã)
        run: node tools/thu-soat-man.mjs

      - name: Thử V50·168 (≤168 trang · 15 màn chính · trần màn theo vai · cấp quyền chỉ Super Admin · Coach↔CRM · tài chính & CRM theo giới hạn)
        run: node tools/thu-v50-168.mjs

      - name: Khung dữ liệu CRM · Tài chính khớp lược đồ csdl.sql
        run: node tools/dung-khung-du-lieu.js --kiem

      - name: Bản đồ cột tự vá lược đồ khớp csdl.sql
        run: node tools/dung-luoc-do-cot.js --kiem

      - name: Thử khói mọi cửa máy chủ (0 lỗi SQL · 3 vai)
        run: node tools/thu-khoi-may-chu.mjs

      - name: Thử liên kết (app ↔ máy chủ · màn ↔ màn · phần của màn chính)
        run: node tools/thu-lien-ket.mjs

      - name: Thử phạm vi nhà · ngang cấp · tự vá lược đồ
        run: node tools/thu-pham-vi.mjs

      - name: Thử lớp hội thoại trợ lý (nghe như tư vấn viên · phân vai · đúng giới hạn)
        run: node tools/thu-tro-ly-hoi-thoai.mjs

      - name: Thử Trợ lý GITA V50 (vai từ phiên · cảm xúc · khẩn không tới AI · Điều 13 · không gợi ý · SA gửi bộ não)
        run: node tools/thu-tro-ly-v50.mjs

      - name: Thử Tra cứu giải pháp 13 mục (chỉ R01–R11 · sổ nhật ký không giữ dữ liệu gia đình · nháp AI không tự vào kho)
        run: node tools/thu-tra-cuu-giai-phap.mjs

      - name: Kho cấp cao · 6 hạng · giá credit hạng × tầng · an toàn không khoá theo gói
        run: node tools/thu-kho-cao.mjs

      - name: Đội Agent — thẻ vai, Trưởng nhóm soát, bộ nhớ chung (5 ca)
        run: node tools/thu-doi-agent.mjs

      - name: Kiến trúc Ngôi nhà thịnh vượng (10 bánh đà cách đều · quay cùng nhịp · không che nhà · lựa chọn quay/dừng)
        run: node tools/thu-ngoi-nha.mjs

      - name: Chạy thử bộ não vận hành V50 (nhịp mỗi giờ · có khách là chạy · lịch · quyền)
        run: node tools/thu-bo-nao-van-hanh.mjs

      - name: Thử Truy vấn đa chiều (bốn dòng chảy · bảng điểm 16 ban)
        run: node tools/thu-dong-chay.mjs

      - name: Thử hợp đồng shot xưởng phim (schema + route năng lực + 10 fixture phim thử)
        run: node tools/thu-hop-dong-shot.mjs

      - name: Thử xưởng quay (khớp môi · chuyển động · nhân vật · tts · film · ảnh khóa)
        run: node tools/thu-xuong-quay.mjs

      - name: Thử nhân vật chuẩn được khóa (hồ sơ + bộ phân giải ảnh)
        run: node tools/thu-nhan-vat-chuan.mjs

      - name: Cú pháp máy quay Kaggle (Python)
        run: python3 -m py_compile may-quay-kaggle/quay-kaggle.py may-quay-kaggle/tao-nhan-vat.py may-quay-kaggle/xuong-phim-studio.py may-quay-kaggle/may-tra-phi.py

      - name: Thử trang trạng thái công khai (không phiên · chỉ tổng hợp số)
        run: node tools/thu-trang-thai.mjs

      - name: Đo 16 hệ (con trỏ sống · SOP đúng miền · 1000 chiến lược · lá chắn 30 tầng)
        run: node tools/do-16-he.js

      - name: Soát bí mật (không khoá API nào trong repo)
        run: node tools/soat-bi-mat.js

      - name: Kỷ luật kho mã (cửa ↔ nhánh · ES5 · gỡ lỗi sót · .gitignore · giấy phép · gói độc · CSP · action ghim)
        run: node tools/thu-ky-luat.mjs

      - name: Trang công khai đủ tệp, không lọt mã nội bộ (dựng lại đúng _site)
        run: node tools/thu-trang-cong-khai.mjs

      - name: Xin thêm — mỗi nhà chỉ chạm phần của mình
        run: node tools/thu-xin-them.mjs

      - name: Phim phân tử — người lạ không kích dịch vụ vẽ trả phí
        run: node tools/thu-phim-phan-tu.mjs

      - name: Liên hệ — thư tới hòm chủ hệ, không lưu, không ra dịch vụ ngoài
        run: node tools/thu-lien-he.mjs

      - name: Đo trang công khai — chỉ đếm, không nhận ra ai, chỉ quản lý đọc được
        run: node tools/thu-do-trang.mjs

      - name: Sổ máy chủ ngoài khớp mã — và mật khẩu mới được soát với danh sách đã lộ
        run: node tools/thu-nguon-ngoai.mjs

      - name: Xưởng tài liệu gia đình — máy soạn từng bước, máy đo biên tập, ba chữ ký mới tới gia đình
        run: node tools/thu-xuong-tai-lieu.mjs

      - name: Mạch việc kẹt — phân biệt kẹt với chờ, nói không biết khi không đọc được, báo một lần, không tự gỡ
        run: node tools/thu-viec-ket.mjs

      - name: Xưởng phim có trần 10 USD/tập — giữ tiền trước, máy chủ tính tiền, cầu dao giờ GPU, cảnh lỗi vẫn tính tiền
        run: node tools/thu-phim-ngan-sach.mjs

      - name: Hướng dẫn từng bước trên màn thật — mọi màn trong cột trái có kịch bản, chữ đã thoát, không liên kết chết
        run: node tools/thu-huong-dan.mjs

      - name: Máy chủ cấp khoá bản .exe — dấu máy không chép được, duyệt đúng một tài khoản
        run: node tools/thu-may-chu-may-tinh.mjs

      - name: Xưởng phim AI — dò nhịp đúng tới mili-giây, danh mục trỏ vào bộ vẽ có thật, nhạc và ảnh không rời máy
        run: node tools/thu-xuong-ai.mjs

      - name: Xưởng phim đào tạo — giọng từng cảnh, 16:9, Studio xuất thật, lưu phim chỉ qua ngoại lệ N4 có sổ, nhãn giọng máy đọc
        run: node tools/thu-xuong-phim.mjs

      - name: Sách nội bộ Cây Tiền — chỉ Super Admin nạp, R01–R11 đọc có nhật ký, trích ngắn, kho mã chỉ có gói .enc
        run: node tools/thu-sach-noi-bo.mjs

      - name: Thử vận hành VIP/VVIP (khởi động · bàn hỗ trợ · chi phí phục vụ)
        run: node tools/thu-vvip-van-hanh.mjs

      - name: Chương trình đào tạo — không tự chấm, không tự ký, máy đọc ba cửa, đủ điều kiện kiểm ở máy chủ
        run: node tools/thu-dao-tao-ct.mjs
      - name: Thi chứng chỉ — đề riêng từng người, không tự chấm, tụt cấp theo tháng, vấn đề khó phải xin ý kiến
        run: node tools/thu-thi-cap.mjs
      - name: Lịch trả lương 05/08 · phiếu phản hồi từng khách · xếp hạng lương thưởng tháng
        run: node tools/thu-xep-hang.mjs
      - name: Kim chỉ nam ở đầu mọi màn khách — chỉ đọc, chỉ họ tên, nhà lấy từ phiên
        run: node tools/thu-kim-chi-nam.mjs
      - name: Tiếng Anh — bộ dịch giữ con số đúng chỗ, từ điển sạch, độ phủ không tụt mốc
        run: node tools/thu-dich.mjs && node tools/trich-chu-viet.js --kiem
      - name: Gói mẫu công khai đã tuyển — giữ khung, bỏ ruột nội dung có cấp phép
        run: node tools/tuyen-mau.js --kiem && node tools/thu-chat-lieu.mjs
      - name: Kho Ngôi nhà thịnh vượng — cẩm nang ba cấp, 1000 nhiệm vụ, cổng theo vai và tầng
        run: node tools/thu-kho-nha.mjs
      - name: Đăng nhập khuôn mặt — bộ xác thực giả WebCrypto, đường máy này + điện thoại QR, cổng chống giả mạo
        run: node tools/thu-sinh-trac.mjs
      - name: Bản tin GITA — người viết khác người duyệt, bài vinh danh phải có việc cụ thể và bằng chứng, câu kiểm tra chấm ở máy chủ, tính vào KPI nghiệp vụ
        run: node tools/thu-truyen-thong.mjs
      - name: Phòng VVIP (Master Blueprint) — nhóm do hai người quyết, người phục vụ VVIP hạng A, điểm chạm đủ bảy lớp + mười tiêu chuẩn, năm quy tắc tần suất, 80% tách ba chỉ số, chưa đo thì nói
        run: node tools/thu-vvip.mjs

      - name: Soát thiết kế tĩnh — không chuyển động nảy, không chữ chạy, không màu cấm (cả dạng %23), chữ chuyển sắc không thêm chỗ mới
        run: node tools/thu-thiet-ke-tinh.mjs

      - name: Móc chặn commit — quét toàn bộ tệp đang theo dõi
        run: node tools/chan-commit.mjs --tat-ca
