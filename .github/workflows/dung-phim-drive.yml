# ═══════════════════════════════════════════════════════════════
# GITA 365 · Xưởng phim — DỰNG PHIM TỪ KHO GOOGLE DRIVE (đường MIỄN PHÍ)
#
# Kho phim Drive (Apps Script) gọi Action này khi app gửi "Làm phim nhanh" (repository_dispatch:
# dung-phim-drive), hoặc bấm tay: Actions → "Dựng phim từ kho Drive" → nhập mã việc.
#   Drive (kế hoạch + ảnh mẫu) → Kaggle GPU miễn phí dựng → phim 1080p về thẳng Drive/Phim/<tháng>/
#
# SECRET cần đặt (Settings → Secrets and variables → Actions):
#   KAGGLE_USERNAME, KAGGLE_KEY        — khoá API Kaggle (kaggle.com → Settings → API)
#   KHO_DRIVE_URL                      — địa chỉ Web app của Kho phim (Apps Script, đuôi /exec)
#   KHO_DRIVE_KHOA                     — KHOA_MAY in ra khi chạy caiDat()
# Khoá Drive KHÔNG đưa vào Kaggle: Action tự lấy việc và tự tải phim lên.
# ═══════════════════════════════════════════════════════════════
name: Dựng phim từ kho Drive

on:
  repository_dispatch:
    types: [dung-phim-drive]
  workflow_dispatch:
    inputs:
      jobid:
        description: "Mã việc (hiện trong app, màn Làm phim nhanh)"
        required: true

permissions:
  contents: read

concurrency:
  group: dung-phim-drive
  cancel-in-progress: false

jobs:
  dung:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      JOBID_VAO: ${{ github.event.client_payload.jobid || inputs.jobid }}
      KHO_DRIVE_URL: ${{ secrets.KHO_DRIVE_URL }}
      KHO_DRIVE_KHOA: ${{ secrets.KHO_DRIVE_KHOA }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KD: xuong-phim-ai/kho-drive/kho_drive.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Kiểm mã việc & cài công cụ
        run: |
          [[ "$JOBID_VAO" =~ ^[a-z0-9]{8,40}$ ]] || { echo "Mã việc không hợp lệ"; exit 1; }
          echo "JOBID=$JOBID_VAO" >> "$GITHUB_ENV"
          python -m pip install --quiet kaggle requests pillow
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Lấy kế hoạch + ảnh từ Drive → bộ dữ liệu Kaggle RIÊNG TƯ
        run: |
          set -e
          python $KD bao "$JOBID" running "Máy dựng miễn phí đã nhận việc — chuẩn bị Kaggle GPU" 5
          python $KD doc-viec "$JOBID" viec
          python - <<'PY'
          import json, os
          kh = json.load(open("viec/ke-hoach.json", encoding="utf-8"))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CHI_CLIP={'1' if kh.get('chi_clip') else ''}\n")
              f.write(f"DU_AN={kh.get('du_an') or ''}\n")
          PY
          # Dự án: ảnh khung đầu từng cảnh (Anh/05.jpg) + giọng mẫu (Giong/<tên>.wav) — link tạm, xong khoá lại
          if [ -n "$(grep -o '"du_an": *"[^"]*"' viec/ke-hoach.json)" ]; then
            python $KD tai-ve-du-an "$JOBID" duan anh,giong || echo "không có ảnh/giọng riêng của dự án"
          fi
          python - <<'PY'
          # Gom phẳng vào ds/: ke-hoach.json · nv-<id>.jpg · canh-<số>.jpg · giong-<id>.<đuôi>
          import json, os, shutil, unicodedata
          from pathlib import Path
          from PIL import Image
          ds = Path("ds"); ds.mkdir(exist_ok=True)
          kh = json.load(open("viec/ke-hoach.json", encoding="utf-8"))
          shutil.copy("viec/ke-hoach.json", ds / "ke-hoach.json")
          def nho(src, dst, canh):
              im = Image.open(src).convert("RGB"); im.thumbnail((canh, canh)); im.save(dst, quality=90)
          for f in Path("viec/nhan-vat").glob("*.jpg"): nho(f, ds / f"nv-{f.stem}.jpg", 1280)
          bd = lambda t: unicodedata.normalize("NFD", t.lower()).encode("ascii", "ignore").decode().replace(" ", "")
          for f in sorted(Path("duan/nguon").glob("*")) if Path("duan/nguon").exists() else []:
              if f.suffix.lower() in (".jpg", ".jpeg", ".png") and f.stem.isdigit():
                  nho(f, ds / f"canh-{f.stem}.jpg", 1600)
              elif f.suffix.lower() in (".wav", ".mp3", ".m4a"):
                  k = bd(f.stem)
                  nv = next((n for n in kh.get("nhan_vat", []) if k and (k == bd(n["id"]) or k == bd(n.get("ten", "")) or k in bd(n.get("ten", "")))), None)
                  if nv: shutil.copy(f, ds / f"giong-{nv['id']}{f.suffix.lower()}")
          print(sorted(os.listdir(ds)))
          PY
          DS="${KAGGLE_USERNAME}/gita-in-${JOBID}"
          echo "DS=$DS" >> "$GITHUB_ENV"
          printf '{"title":"gita-in-%s","id":"%s","licenses":[{"name":"CC0-1.0"}]}' "$JOBID" "$DS" > ds/dataset-metadata.json
          kaggle datasets create -p ds -q      # mặc định RIÊNG TƯ (không có cờ -u)
          for i in $(seq 1 40); do
            S=$(kaggle datasets status "$DS" 2>/dev/null || true); echo "dataset: $S"
            case "$S" in *ready*) break ;; esac; sleep 15
          done

      - name: Dựng kernel Kaggle
        run: |
          set -e
          SLUG="${KAGGLE_USERNAME}/gita-drive-${JOBID}"
          echo "SLUG=$SLUG" >> "$GITHUB_ENV"
          mkdir -p kernel
          cat > kernel/gita_kernel.py <<PY
          import subprocess, glob, shutil, os
          from pathlib import Path
          vao = next(Path("/kaggle/input").glob("gita-in-${JOBID}*"))
          for d in ("nhan-vat", "anh-canh", "giong"): os.makedirs(d, exist_ok=True)
          shutil.copy(vao / "ke-hoach.json", "ke-hoach.json")
          for f in vao.iterdir():
              if f.name.startswith("nv-"): shutil.copy(f, f"nhan-vat/{f.name[3:]}")
              elif f.name.startswith("canh-"): shutil.copy(f, f"anh-canh/{f.name[5:]}")
              elif f.name.startswith("giong-"):
                  subprocess.run(["ffmpeg","-y","-loglevel","error","-i",str(f),"-ac","1","-ar","24000",f"giong/{f.stem[6:]}.wav"], check=False)
          subprocess.run(["git","clone","--depth","1","https://github.com/${{ github.repository }}","repo"], check=True)
          subprocess.run(["bash","repo/xuong-phim-ai/cai-dat-noi-bo.sh"], check=False, env={**os.environ, "MUC": "vua"})
          CHI_CLIP = "${CHI_CLIP}" == "1"
          subprocess.run(["python","repo/xuong-phim-ai/gita_xuong_phim.py","--ke-hoach","ke-hoach.json",
                          "--run", "anh,giong,video,lipsync,nang_net,may_quay" if CHI_CLIP else "all","--root","/kaggle/working/ket-qua"], check=True)
          if CHI_CLIP:
              os.makedirs("/kaggle/working/clips", exist_ok=True)
              for f in glob.glob("/kaggle/working/ket-qua/*/clip/*.mp4"):
                  if "-" not in os.path.basename(f): shutil.copy(f, "/kaggle/working/clips/")
              if not os.listdir("/kaggle/working/clips"): raise SystemExit("Không dựng được cảnh AI nào")
          else:
              for ten in ("phim-cuoi.mp4", "phim-cuoi-phude.mp4"):
                  f = glob.glob(f"/kaggle/working/ket-qua/**/{ten}", recursive=True)
                  if f: shutil.copy(f[0], f"/kaggle/working/{ten}")
              if not os.path.exists("/kaggle/working/phim-cuoi.mp4"): raise SystemExit("Không thấy phim-cuoi.mp4")
          PY
          cat > kernel/kernel-metadata.json <<JSON
          {"id": "${SLUG}", "title": "GITA drive ${JOBID}", "code_file": "gita_kernel.py", "language": "python",
           "kernel_type": "script", "is_private": true, "enable_gpu": true, "enable_internet": true,
           "dataset_sources": ["${DS}"], "competition_sources": [], "kernel_sources": []}
          JSON

      - name: Đẩy lên Kaggle và chờ dựng
        run: |
          set -e
          kaggle kernels push -p kernel
          python $KD bao "$JOBID" running "Kaggle GPU miễn phí đang dựng phim (có thể vài giờ)…" 10
          for i in $(seq 1 105); do
            sleep 180
            S=$(kaggle kernels status "$SLUG" 2>/dev/null || echo "unknown")
            echo "[$i] $S"
            PT=$(( 10 + i * 75 / 105 ))
            case "$S" in
              *complete*) echo "XONG"; exit 0 ;;
              *error*|*cancel*) python $KD bao "$JOBID" error "Kaggle báo lỗi khi dựng — xem log kernel $SLUG" 0; exit 1 ;;
              *) python $KD bao "$JOBID" running "Kaggle đang dựng… ($(( i * 3 )) phút)" $PT ;;
            esac
          done
          python $KD bao "$JOBID" error "Quá 5 giờ chưa xong — tách kịch bản ngắn hơn" 0; exit 1

      - name: Đưa phim về Google Drive
        run: |
          set -e
          python $KD bao "$JOBID" running "Đưa phim về kho Google Drive…" 92
          mkdir -p out && kaggle kernels output "$SLUG" -p out
          if [ "$CHI_CLIP" = "1" ]; then
            N=0
            for f in $(find out -path '*clips/*.mp4' | sort); do
              b=$(basename "$f"); [[ "$b" =~ ^[0-9]{2,3}\.mp4$ ]] || continue
              python $KD tai-len-canh "$JOBID" "$DU_AN" "$f" "$b"; N=$((N+1))
            done
            [ "$N" -gt 0 ] || { python $KD bao "$JOBID" error "Không có cảnh AI nào để đưa về Drive" 0; exit 1; }
            python $KD bao "$JOBID" done "Xong $N cảnh AI — đã vào thư mục AI của dự án trên Drive" 100
            exit 0
          fi
          FILM=$(find out -name 'phim-cuoi.mp4' | head -1)
          [ -n "$FILM" ] || { python $KD bao "$JOBID" error "Không tải được phim từ Kaggle" 0; exit 1; }
          TEN=$(python -c "import json;print(json.load(open('viec/ke-hoach.json',encoding='utf-8')).get('tieu_de') or 'Phim GITA365')")
          python $KD tai-len "$JOBID" "$FILM" chinh "$TEN"
          PD=$(find out -name 'phim-cuoi-phude.mp4' | head -1)
          [ -n "$PD" ] && python $KD tai-len "$JOBID" "$PD" phude "$TEN" || true
          python $KD bao "$JOBID" done "Hoàn tất — phim đã nằm trong Drive: GITA365 · Kho phim/Phim" 100

      - name: Xoá bộ dữ liệu tạm trên Kaggle
        if: always()
        run: '[ -n "$DS" ] && (yes | kaggle datasets delete "$DS" 2>/dev/null || echo "giữ bộ dữ liệu riêng tư $DS — xoá tay nếu muốn") || true'

      - name: Báo lỗi nếu hỏng giữa chừng
        if: failure()
        run: python $KD bao "$JOBID" error "Dây chuyền dừng giữa chừng — xem log GitHub Action" 0 || true
