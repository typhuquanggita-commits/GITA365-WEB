# ═══════════════════════════════════════════════════════════════
# GITA 365 — Tạo ảnh minh hoạ 3D cho các phần của web app
#
# Mô hình FLUX.1-schnell (Apache-2.0, dùng thương mại được) chạy CPU bằng
# stable-diffusion.cpp NGAY TRÊN MÁY GITHUB — không cần khoá dịch vụ nào,
# không tốn tiền. (Bản đầu gọi Workers AI bằng khoá Cloudflare ở Secrets;
# khoá ấy chỉ có quyền triển khai, Workers AI trả 401.)
# Bảy máy chạy song song, mỗi máy ba ảnh; máy gộp nén WebP và đẩy sang
# nhánh dữ liệu riêng `anh-3d` để người duyệt trước khi vào assets/.
# Lời nhắc chỉ ASCII, không tên người (Điều 13).
# ═══════════════════════════════════════════════════════════════
name: Tạo ảnh 3D cho web app

on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'tools/anh-3d/**'
      - '.github/workflows/tao-anh-3d.yml'

permissions:
  contents: read

concurrency:
  group: tao-anh-3d
  cancel-in-progress: true

jobs:
  tao:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        nhom: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - name: Harden runner (ghi lại mọi kết nối ra ngoài)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Dựng stable-diffusion.cpp (CPU)
        run: |
          set -eu
          git clone --depth 1 --recursive https://github.com/leejet/stable-diffusion.cpp /tmp/sdcpp
          cmake -S /tmp/sdcpp -B /tmp/sdcpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=ON > /tmp/cmake.log
          cmake --build /tmp/sdcpp/build --config Release -j"$(nproc)" > /tmp/build.log || { tail -40 /tmp/build.log; exit 1; }
          SD=$(find /tmp/sdcpp/build -type f -perm -u+x \( -name sd -o -name sd-cli \) | head -1)
          test -n "$SD" || { echo "::error::Không thấy tệp chạy sd sau khi dựng"; ls -R /tmp/sdcpp/build/bin | head; exit 1; }
          echo "SD=$SD" >> "$GITHUB_ENV"
          "$SD" --help | head -5

      - name: Tải FLUX.1-schnell (GGUF) từ Hugging Face
        run: |
          set -eu
          mkdir -p /mnt/mh 2>/dev/null && M=/mnt/mh || { mkdir -p "$HOME/mh"; M="$HOME/mh"; }
          sudo chown "$(id -u)" "$M" 2>/dev/null || true
          echo "MH=$M" >> "$GITHUB_ENV"
          tai() { curl -fsSL --retry 4 -o "$M/$1" "$2" || { echo "::error::Tải hỏng: $2"; exit 1; }; echo "$1 $(du -h "$M/$1" | cut -f1)"; }
          tai flux1-schnell-Q4_0.gguf https://huggingface.co/city96/FLUX.1-schnell-gguf/resolve/main/flux1-schnell-Q4_0.gguf
          tai ae.safetensors https://huggingface.co/black-forest-labs/FLUX.1-schnell/resolve/main/ae.safetensors
          tai clip_l.safetensors https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors
          tai t5xxl.gguf https://huggingface.co/city96/t5-v1_1-xxl-encoder-gguf/resolve/main/t5-v1_1-xxl-encoder-Q5_K_M.gguf

      - name: Tạo ảnh nhóm ${{ matrix.nhom }}
        run: python3 -I tools/anh-3d/chay-sdcpp.py "$SD" "$MH" ra ${{ matrix.nhom }} 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anh-${{ matrix.nhom }}
          path: ra/*.png
          if-no-files-found: ignore
          retention-days: 3

  gop:
    needs: tao
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner (ghi lại mọi kết nối ra ngoài)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: goc
          merge-multiple: true

      - name: Nén WebP 1152×768
        run: |
          set -eu
          ls goc/*.png >/dev/null 2>&1 || { echo "::error::Không máy nào tạo được ảnh"; exit 1; }
          python3 -m pip install --quiet pillow
          python3 -I tools/anh-3d/nen-anh.py goc ra/anh
          python3 -I -c "import json;d=json.load(open('tools/anh-3d/de-bai.json'));json.dump({'moHinh':'FLUX.1-schnell Q4_0 (stable-diffusion.cpp, CPU)','giayPhep':'Apache-2.0','anh':[{k:a[k] for k in ('ma','ten','alt','p')} for a in d['anh']]},open('ra/anh/nguon.json','w'),ensure_ascii=False,indent=1)"

      - name: Đẩy ảnh sang nhánh dữ liệu anh-3d
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd ra
          git init -q -b anh-3d
          git config user.name "gita-tao-anh-3d"
          git config user.email "gita-tao-anh-3d@users.noreply.github.com"
          git add anh
          git commit -qm "Ảnh 3D cho web app (FLUX.1-schnell, Apache-2.0)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" anh-3d
          echo "::notice::Đã đẩy $(ls anh/*.webp | wc -l) ảnh sang nhánh anh-3d."
