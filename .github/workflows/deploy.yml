name: Deploy GITA365 to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CỔNG: chạy trọn bộ kiểm (kiem-tra.yml) TRƯỚC khi đụng tới production.
  # Trước 9/10/2026 bộ kiểm chạy song song và chỉ báo cáo — một lượt tải tệp
  # lên qua trang web GitHub đi thẳng ra trang thật dù bộ kiểm đỏ.
  kiem:
    name: Bộ kiểm trước khi triển khai
    uses: ./.github/workflows/kiem-tra.yml
    permissions:
      contents: read

  worker:
    name: Deploy API worker
    needs: kiem
    runs-on: ubuntu-latest
    # Luôn deploy Worker khi có thay đổi trên main: lọc theo đường dẫn bằng
    # github.event.commits.*.modified không đáng tin (mảng lồng mảng) và đã
    # khiến Worker bị bỏ qua. Deploy lại cùng mã là vô hại.
    steps:
      - name: Harden runner (ghi lại mọi kết nối ra ngoài)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Validate Cloudflare credentials and API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          if (!token) {
            console.error('Missing GitHub Actions secret CLOUDFLARE_API_TOKEN.');
            process.exit(1);
          }
          if (/[\u0000-\u0020\u007f]/.test(token)) {
            console.error('CLOUDFLARE_API_TOKEN contains whitespace/control characters. Recreate the secret without quotes or a trailing newline.');
            process.exit(1);
          }
          if (!/^[a-f0-9]{32}$/i.test(account)) {
            console.error('CLOUDFLARE_ACCOUNT_ID must be the 32-character hexadecimal Cloudflare account ID.');
            process.exit(1);
          }
          NODE
          node <<'NODE'
          (async () => {
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
                headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN }
              });
              const body = await response.json();
              if (!response.ok || !body.success || !body.result || body.result.status !== 'active') {
                console.error('Cloudflare rejected or deactivated CLOUDFLARE_API_TOKEN. Replace it in GitHub Actions secrets and verify Pages:Edit and Workers Scripts:Edit permissions.');
                process.exitCode = 1;
                return;
              }
              console.log('Cloudflare API token is active.');
            } catch (_) {
              console.error('Could not verify the Cloudflare API token. Check GitHub runner network access and the Actions secret.');
              process.exitCode = 1;
            }
          })();
          NODE

      # CỔNG KIỂM TRƯỚC KHI DEPLOY: Worker lỗi cú pháp hoặc không nạp được
      # thì dừng ở đây — bản đang chạy trên Cloudflare giữ nguyên.
      - name: Gate — kiểm cú pháp & nạp thử Worker
        run: |
          set -eu
          for f in may-chu/*.js; do node --check "$f"; done
          node --input-type=module -e "const w=(await import('./may-chu/worker.js')).default; if(typeof w.fetch!=='function'||typeof w.scheduled!=='function'){console.error('worker.js thiếu fetch/scheduled');process.exit(1)} console.log('Worker nạp được.')"

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          workingDirectory: may-chu
          command: deploy

      # Lệnh nạp khoá ghim wrangler 4.148.0 — bản đã chạy xanh ở lượt triển khai
      # 07/10/2026. Lượt 09/10 ghim 4.149.0 (phát hành 08/10) thì bước nạp khoá
      # hỏng sau 1 giây trong khi bước deploy Worker vẫn xanh. Muốn nâng bản thì
      # nâng ở nhánh thử trước, đừng nâng thẳng trên main.
      # Secret của cầu nối Gmail: đặt ở GitHub (Settings → Secrets → Actions)
      # thì workflow nạp vào Worker, chủ hệ không phải chạy wrangler trên máy.
      - name: Nạp secret cầu nối Gmail vào Worker (nếu có)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITA_CAU_NOI_GMAIL: ${{ secrets.GITA_CAU_NOI_GMAIL }}
          GITA_KHOA_CAU_NOI: ${{ secrets.GITA_KHOA_CAU_NOI }}
        working-directory: may-chu
        run: |
          set -eu
          if [ -z "${GITA_CAU_NOI_GMAIL:-}" ] || [ -z "${GITA_KHOA_CAU_NOI:-}" ]; then
            echo "Chưa có GITA_CAU_NOI_GMAIL/GITA_KHOA_CAU_NOI ở GitHub secrets — bỏ qua."
            exit 0
          fi
          f="$RUNNER_TEMP/bi-mat-thu.json"
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({GITA_CAU_NOI_GMAIL: process.env.GITA_CAU_NOI_GMAIL, GITA_KHOA_CAU_NOI: process.env.GITA_KHOA_CAU_NOI}))" "$f"
          npx --yes wrangler@4.148.0 secret bulk "$f"
          rm -f "$f"

      # Khoá fal.ai cho "Xưởng phim tự động A-Z" (chỉ Super Admin dùng).
      - name: Nạp khoá fal.ai vào Worker (nếu có)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITA_KHOA_FAL: ${{ secrets.GITA_KHOA_FAL }}
        working-directory: may-chu
        run: |
          set -eu
          if [ -z "${GITA_KHOA_FAL:-}" ]; then
            echo "Chưa có GITA_KHOA_FAL ở GitHub secrets — bỏ qua."
            exit 0
          fi
          f="$RUNNER_TEMP/bi-mat-fal.json"
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({GITA_KHOA_FAL: process.env.GITA_KHOA_FAL}))" "$f"
          npx --yes wrangler@4.148.0 secret bulk "$f"
          rm -f "$f"

      # Hộp thư GitHub: Worker nhờ kho riêng tư gita365-hop-thu mở issue →
      # GitHub gửi email về hòm chủ hệ. Khoá là fine-grained token chỉ cho kho đó.
      - name: Nạp khoá hộp thư GitHub vào Worker (nếu có)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITA_GH_KHOA_THU: ${{ secrets.GITA_GH_KHOA_THU }}
        working-directory: may-chu
        run: |
          set -eu
          if [ -z "${GITA_GH_KHOA_THU:-}" ]; then
            echo "Chưa có GITA_GH_KHOA_THU ở GitHub secrets — bỏ qua."
            exit 0
          fi
          f="$RUNNER_TEMP/bi-mat-gh-thu.json"
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({GITA_GH_KHOA_THU: process.env.GITA_GH_KHOA_THU.trim()}))" "$f"
          npx --yes wrangler@4.148.0 secret bulk "$f"
          rm -f "$f"

      - name: Nạp khoá xưởng quay khớp môi vào Worker (nếu có)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITA_KHOA_XUONG_QUAY: ${{ secrets.GITA_KHOA_XUONG_QUAY }}
        working-directory: may-chu
        run: |
          set -eu
          if [ -z "${GITA_KHOA_XUONG_QUAY:-}" ]; then
            echo "Chưa có GITA_KHOA_XUONG_QUAY ở GitHub secrets — bỏ qua."
            exit 0
          fi
          f="$RUNNER_TEMP/bi-mat-quay.json"
          node -e "require('fs').writeFileSync(process.argv[1], JSON.stringify({GITA_KHOA_XUONG_QUAY: process.env.GITA_KHOA_XUONG_QUAY.trim()}))" "$f"
          npx --yes wrangler@4.148.0 secret bulk "$f"
          rm -f "$f"

      - name: Verify Worker health
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "https://gita365.typhuquanggita.workers.dev/" -o /tmp/worker-health.json; then
              break
            fi
            if [ "$attempt" = 5 ]; then
              echo "Worker health endpoint failed after deployment."
              exit 1
            fi
            sleep 5
          done
          node -e "const s=require('/tmp/worker-health.json'); if (!s.ok || !Number.isFinite(s.daNapKhoa) || s.daNapKhoa < 1) { console.error('Worker responded but its status/required keyset is unhealthy.'); process.exit(1); } console.log('Worker healthy; keyset loaded.');"

  pages:
    name: Deploy static application
    needs: worker
    # Chỉ đưa trang lên khi Worker đã lên THÀNH CÔNG — trước đây là
    # always(), nên Worker hỏng mà trang mới vẫn lên, hai bên lệch nhau.
    if: needs.worker.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (ghi lại mọi kết nối ra ngoài)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check out application
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build browser bundles from source
        run: |
          set -eu
          node tools/gop-src.js
          node tools/gop-src.js --kiem

      - name: Assemble public Pages artifact
        # Danh sách trắng nằm ở tools/dung-site.sh — CHUNG với bộ kiểm
        # tools/thu-trang-cong-khai.mjs, để thứ được kiểm là thứ được đưa lên.
        run: bash tools/dung-site.sh _site

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: _site
          path: _site
          retention-days: 1

      - name: Validate Cloudflare credentials and API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          node <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN || '';
          const account = process.env.CLOUDFLARE_ACCOUNT_ID || '';
          if (!token) {
            console.error('Missing GitHub Actions secret CLOUDFLARE_API_TOKEN.');
            process.exit(1);
          }
          if (/[\u0000-\u0020\u007f]/.test(token)) {
            console.error('CLOUDFLARE_API_TOKEN contains whitespace/control characters. Recreate the secret without quotes or a trailing newline.');
            process.exit(1);
          }
          if (!/^[a-f0-9]{32}$/i.test(account)) {
            console.error('CLOUDFLARE_ACCOUNT_ID must be the 32-character hexadecimal Cloudflare account ID.');
            process.exit(1);
          }
          NODE
          node <<'NODE'
          (async () => {
            try {
              const response = await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify', {
                headers: { Authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN }
              });
              const body = await response.json();
              if (!response.ok || !body.success || !body.result || body.result.status !== 'active') {
                console.error('Cloudflare rejected or deactivated CLOUDFLARE_API_TOKEN. Replace it in GitHub Actions secrets and verify Pages:Edit and Workers Scripts:Edit permissions.');
                process.exitCode = 1;
                return;
              }
              console.log('Cloudflare API token is active.');
            } catch (_) {
              console.error('Could not verify the Cloudflare API token. Check GitHub runner network access and the Actions secret.');
              process.exitCode = 1;
            }
          })();
          NODE

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          command: pages deploy _site --project-name=gita365 --branch=main

  github-pages:
    name: Mirror to GitHub Pages artifact
    needs: pages
    # Không có dòng này thì job bị bỏ qua mỗi khi job worker bị bỏ qua
    # (điều kiện mặc định success() xét cả job tổ tiên) — bản GitHub
    # Pages đã đứng yên từ 20/9 vì thế.
    if: always() && needs.pages.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download Pages artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: _site
          path: _site

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
