name: Validate GITA365 Pages release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: Build public Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Build browser bundles from source
        run: |
          set -eu
          node tools/gop-src.js
          node tools/gop-src.js --kiem

      - name: Assemble public Pages artifact
        run: |
          set -eu
          node tools/build-pages.js
          test ! -e _site/may-chu
          test ! -e _site/tools
          test ! -e _site/kho/khoa.json

      - name: Run release readiness checks
        run: node tools/soat-san-sang.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 1

      # Cloudflare Pages deploys this repository through its Git integration.
      # Keeping this workflow credential-free means a malformed Actions secret
      # cannot block a public Pages release; Worker deployment remains manual.
