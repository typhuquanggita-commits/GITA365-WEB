name: Deploy GITA365 to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pages:
    name: Deploy static application
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Build browser bundles from source
        run: |
          set -eu
          node tools/gop-src.js
          node tools/gop-src.js --kiem

      - name: Assemble public Pages artifact
        run: |
          set -eu
          mkdir -p _site
          find . -maxdepth 1 -type f -name '*.html' -exec cp {} _site/ \;
          cp gita-app.js gita-nghe.js cau-hinh.js sw.js manifest.webmanifest \
            _headers _redirects robots.txt sitemap.xml _site/
          cp -R assets kho _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/gita-app.js
          test -s _site/gita-nghe.js
          test -d _site/kho
          test ! -e _site/may-chu
          test ! -e _site/tools
          printf 'Prepared Cloudflare Pages artifact: %s files\n' "$(find _site -type f | wc -l)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=gita365 --branch=main

  worker:
    name: Deploy API worker
    if: github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ' '), 'may-chu/') || contains(join(github.event.commits.*.added, ' '), 'may-chu/') || contains(join(github.event.commits.*.removed, ' '), 'may-chu/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: may-chu
          command: deploy
