name: Validate GITA365 Pages release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public:
    name: Build public Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Build browser bundles from source
        run: |
          set -eu
          node tools/gop-src.js
          node tools/gop-src.js --kiem

      - name: Assemble public Pages artifact
        run: |
          set -eu
          node tools/build-pages.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: _site
          path: _site
          retention-days: 1

      - name: Deploy production Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=gita365-web --branch=main
