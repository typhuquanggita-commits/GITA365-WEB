# Build and publish the tracked static app; this repository does not use a
# web-app.zip upload artifact.
name: Publish GITA365 Web App

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'gita-app.js'
      - 'gita-nghe.js'
      - 'cau-hinh.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - '404.html'
      - 'CNAME'
      - '_headers'
      - '_redirects'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'assets/**'
      - 'kho/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          set -eu
          mkdir -p _site
          cp index.html gita-app.js gita-nghe.js cau-hinh.js sw.js \
            manifest.webmanifest 404.html _headers _redirects \
            robots.txt sitemap.xml _site/
          cp -R assets kho _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/gita-app.js
          test -s _site/gita-nghe.js
          test -d _site/kho
          printf 'Prepared Pages artifact: %s files\n' "$(find _site -type f | wc -l)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
