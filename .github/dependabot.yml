# Dependabot: báo khi có bản vá an ninh cho thư viện bên thứ ba.
# Kho không có package.json ở gốc — mỗi khu có thư viện riêng khai một mục.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # Bộ đóng gói máy tính (Electron) — Electron lỗi thời là lỗ an ninh thật.
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /xuong-phim-ai/tu-dong/worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /xuong-phim-ai
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
