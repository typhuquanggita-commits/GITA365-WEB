# Cấu hình thật: mô hình chạy trên máy GPU của anh qua Ollama.
# Ollama mở cổng tương thích OpenAI ở /v1, nên dùng api_type "openai".
# api_key ở đây là chữ giả "ollama", không phải khoá thật.
llm:
  api_type: "openai"
  base_url: "http://127.0.0.1:11434/v1"
  api_key: "ollama"
  model: "qwen2.5-coder:14b"
  timeout: 900
  stream: false
repair_llm_output: true
