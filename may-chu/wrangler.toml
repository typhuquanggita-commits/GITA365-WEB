# ═══════════════════════════════════════════════════════════════
#  GITA 365 · CẤU HÌNH TRIỂN KHAI CỬA VÀO MỚI
#
#  Chưa triển khai — tệp này là bản khai để lúc triển khai không phải
#  nhớ lại từ đầu. Năm việc chủ hệ phải làm bằng tay, kê ở cuối tệp.
#
#  ── VÌ SAO CLOUDFLARE WORKERS ──
#
#  Đo ở tools/do-tai-may-chu.js: chỗ chặn sớm nhất KHÔNG phải Sheets mà
#  là trần 30 LƯỢT CHẠY ĐỒNG THỜI của Apps Script. Ở 100.000 tài khoản,
#  giờ cao điểm cần khoảng 1.250 lượt. Đổi kho dữ liệu mà giữ cửa vào
#  Apps Script là gỡ trần thứ nhất, giữ nguyên trần thứ hai.
#
#  Workers không có trần ấy — nó chạy ở hàng trăm nơi cùng lúc và tự
#  giãn. Thêm ba lý do nữa, theo đúng thứ tự quan trọng với kho này:
#
#    · D1 CHÍNH LÀ SQLite, nên may-chu/csdl.sql chạy ở máy và chạy trên
#      máy chủ là cùng một cỗ máy — bộ thử không phải bản mô phỏng.
#    · Pages phục vụ luôn phần tĩnh (index.html, gita-app.js, kho/*.enc)
#      trên CÙNG một tên miền với Worker, nên không có CORS, không có
#      lượt gọi thăm dò trước mỗi yêu cầu.
#    · Một nhà cung cấp, một hoá đơn. Mức miễn phí đủ cho giai đoạn đầu.
#
#  ── CÒN Ở LẠI GOOGLE ──
#
#  Drive vẫn giữ tài liệu và minh chứng: chúng đã ở đó, chủ hệ đã quen
#  thao tác trên đó, và chuyển đi không đổi được con số nào trong bản
#  đo. Chuyển một thứ đang chạy tốt là mua rủi ro không mua lợi ích.
# ═══════════════════════════════════════════════════════════════

name = "gita365"
main = "worker.js"
compatibility_date = "2026-09-01"

# ── GÓI WORKERS PAID (chủ hệ lên gói 5 USD/tháng, 10/10/2026) ──
#
# CPU mỗi lượt. Gói miễn phí chỉ cho 10 ms — băm mật khẩu PBKDF2 100.000
# vòng, nạp kho 1000 vấn đề theo lô, một lượt nhịp bộ não đều có thể vượt
# và bị cắt GIỮA CHỪNG (ghi dở, báo lỗi 1102). Gói Paid mặc định 30 giây;
# khai thẳng ra để người đọc sau biết trần là bao nhiêu và vì sao. Không
# đặt cao hơn: một vòng lặp hỏng chạy 5 phút là 5 phút tính tiền CPU.
[limits]
cpu_ms = 30000

# Đặt Worker GẦN cơ sở dữ liệu. Gần như mọi cửa gọi D1 nhiều lượt liên
# tiếp; Worker chạy ở điểm biên gần người dùng thì mỗi lượt D1 đi một
# vòng xa. "smart" để Cloudflare tự đo và chỉ dời khi có lợi — cron không bị ảnh hưởng.
[placement]
mode = "smart"

# Nhật ký để lần lỗi (Workers Logs — gói Paid có sẵn 20 triệu dòng/tháng).
# Lần trước trợ lý báo AI_LOI mà bảng Cloudflare không có dòng nào để đọc.
# Chỉ giữ dòng console do mã ghi (mã đã không ghi câu hỏi hay dữ liệu
# gia đình); TẮT nhật ký từng lượt gọi để không giữ đầu yêu cầu (có mã phiên).
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[vars]
# KHÔNG phải bí mật — DANH SÁCH origin công khai của bản web, phân tách
# bằng dấu phẩy. Hai việc:
#   1. CORS: Worker chỉ cho các origin này gọi. PHẢI gồm MỌI địa chỉ
#      đang chạy web (kể cả bản PWA cài từ địa chỉ đó) — thiếu một là
#      app báo "không kết nối được máy chủ" dù Worker vẫn sống.
#      Không bao giờ thêm 'null' (file://).
#   2. Origin ĐẦU TIÊN dùng để dựng đường dẫn kích hoạt trong thư.
# Địa chỉ web chính thức: https://gita365.pages.dev (đứng ĐẦU — dùng cho
# đường dẫn trong thư). Bản sao trên GitHub Pages
# (https://typhuquanggita-commits.github.io/GITA365-WEB/) do workflow
# deploy tự đồng bộ; người dùng đã cài PWA từ đó nên phải cho qua.
GITA_DIA_CHI_WEB = "https://gita365.pages.dev,https://typhuquanggita-commits.github.io"

# Địa chỉ đứng tên người gửi KHI GỬI QUA RESEND, dạng
# "GITA 365 <dia-chi@ten-mien>". Resend CHỈ cho gửi từ tên miền đã xác
# minh (SPF/DKIM), nên KHÔNG đặt địa chỉ @gmail.com ở đây. Dự án chưa có
# tên miền riêng → đường gửi chính là CẦU NỐI GMAIL (hai secret
# GITA_CAU_NOI_GMAIL + GITA_KHOA_CAU_NOI, xem docs/MAY_CHU.md): thư đi
# từ chính typhuquanggita@gmail.com. Để trống biến này thì Resend chỉ
# không được dùng; cầu nối Gmail vẫn gửi bình thường.
GITA_THU_GUI_TU = ""

# Khách bấm "Trả lời" thì thư về đây (reply-to). Email chính thức.
GITA_THU_TRA_LOI = "typhuquanggita@gmail.com"

# Hòm thư nhận báo DÒNG DOANH THU — chốt của chủ hệ thống bản 9.96.
# Mỗi lượt khách chuyển tiền gửi một thư về đây, và mỗi sáng gửi bản
# tổng của ngày hôm trước.
#
# Để ở cấu hình chứ không gõ cứng trong mã: đổi người nhận là một lượt
# sửa cấu hình, không phải một lượt sửa mã và phát hành lại.
#
# ĐỂ TRỐNG THÌ KHÔNG GỬI GÌ CẢ — và đó là hành vi đúng cho một bản chạy
# thử: không ai muốn bộ thử của mình gửi thư thật vào hòm thư thật.
GITA_THU_DOANH_THU = "typhuquanggita@gmail.com"

# Bộ não đa trí (bo-nao-da-tri.js) — chủ hệ bật 07/10/2026 ("bật chế độ làm
# việc full 24/7"). Chế độ TIẾT KIỆM: chỉ bộ nhớ đệm + Workers AI (miễn phí,
# 10.000 neuron/ngày) — không tốn tiền nhà cung cấp trả phí nào. Muốn chạy
# đủ năm nhà (DeepSeek · Gemini · OpenAI · Claude · Grok) thì nạp khoá bằng
# wrangler secret put rồi đổi dòng dưới thành "0". Mọi lượt vẫn qua cổng
# Điều 13 (soatRaNhaCungCap) trước khi rời hệ.
GITA_DA_TRI_BAT = "1"
GITA_CHE_DO_TIET_KIEM = "1"

# HỘP THƯ GITHUB (thu.js · guiQuaGithub_): kho RIÊNG TƯ có workflow mở
# issue khi nhận repository_dispatch "thu" → GitHub gửi email về hòm chủ
# hệ. Chỉ dùng cho thư tới hòm chủ hệ (mã bảo mật, báo doanh thu, quản
# trị). Khoá đi kèm là secret GITA_GH_KHOA_THU (nạp qua deploy.yml).
GITA_GH_HOP_THU = "typhuquanggita-commits/gita365-hop-thu"
# XƯỞNG QUAY KHỚP MÔI 0 ĐỒNG (may-chu/xuong-quay.js): kho CÔNG KHAI chạy
# SadTalker trên máy CPU miễn phí của GitHub Actions. Khoá chung giữa
# Worker và kho quay là secret GITA_KHOA_XUONG_QUAY (nạp qua deploy.yml).
# Nếu GITA_GH_KHOA_THU cũng có quyền kho này thì máy quay bật ngay,
# không thì kho tự nhặt việc theo lịch 10 phút/lần.
GITA_GH_XUONG_QUAY = "typhuquanggita-commits/gita365-xuong-quay"

# XƯỞNG PHIM 0 ĐỒNG (9.99.253, may-chu/phim-0d.js). "1" = KHOÁ CỨNG cửa
# fal.ai trả phí; xưởng phim chỉ dùng Workers AI miễn phí + giọng đọc
# chạy trong trình duyệt. Thiếu biến cũng tính là "1". Chỉ đổi sang "0"
# khi chủ hệ CHỦ ĐỘNG muốn trả tiền fal.ai.
GITA_PHIM_CHI_0D = "1"
# Trần neuron Workers AI mỗi ngày cho xưởng phim (miễn phí là 10.000,
# máy chủ không cho đặt quá 9.500 để chừa lề an toàn).
# LƯU Ý TỪ KHI LÊN GÓI PAID: quá 10.000 neuron/ngày thì Cloudflare TÍNH TIỀN
# (≈ 0,011 USD / 1.000 neuron) thay vì chặn như gói miễn phí. Trần 9.000 này
# chỉ canh xưởng phim; trợ lý và bộ não đa trí đếm riêng theo token. Đặt
# cảnh báo hoá đơn ở Dashboard → Billing → Notifications để biết sớm.
GITA_PHIM_TRAN_NEURON = "9000"
# Hạng "Bom tấn Cloudflare" dùng FLUX.2 klein 9B (đẹp hơn) CHỈ khi số
# này > 0 — đó là neuron TRẢ PHÍ mỗi ngày (cần gói Workers Paid 5 USD/
# tháng; 1.000 neuron ≈ 0,011 USD; một ảnh 9B ≈ 1.500 neuron). "0" =
# tắt: Bom tấn vẫn chạy 0 đồng bằng klein 4B khung lớn.
GITA_PHIM_TRAN_TRA_PHI = "0"
# Soát mật khẩu MỚI với danh sách đã lộ (Pwned Passwords, miễn phí, không
# khoá). Chỉ gửi 5 ký tự đầu của mã băm SHA-1 — không gửi mật khẩu, không
# gửi tên hay thư. Dịch vụ không trả lời thì cửa vẫn mở (xem mkDaLo ở
# nen.js). "0" = tắt.
GITA_KIEM_MK_RO = "1"
# Xưởng phim trả phí (may-chu/phim-ngan-sach.js). Chủ hệ mở 3–10 USD cho
# một video 30 phút: trần mỗi tập KHÔNG BAO GIỜ quá 10 (mã chặn cứng), số
# này chỉ hạ được. Trần tháng là lưới an toàn thứ hai — đổi khi cần. Đơn giá
# GPU theo giờ của nhà cho thuê đang dùng (Modal H100 theo README-nhanh).
GITA_PHIM_TRAN_TAP_USD = "10"
GITA_PHIM_TRAN_THANG_USD = "100"
GITA_PHIM_GPU_USD_GIO = "3.95"

# VẼ ẢNH CẢNH BẰNG DỊCH VỤ NGOÀI (tuỳ chọn, MẶC ĐỊNH TẮT để giữ 0đ —
# may-chu/phim-phan-tu.js). Chỉ khi chủ hệ tự muốn dùng tài khoản riêng
# (ví dụ OpenAI gpt-image) cho ảnh nhân vật/cảnh đẹp hơn Workers AI:
#   GITA_VE_ANH_URL  = địa chỉ Images API tương thích OpenAI
#   GITA_VE_ANH_MAU  = tên mô hình (mặc định gpt-image-1)
#   GITA_VE_ANH_CO   = khổ ảnh (mặc định 1024x1536)
#   Khoá KHÔNG để ở đây: npx wrangler secret put GITA_VE_ANH_KHOA
# Có cấu hình thì máy chủ ưu tiên dịch vụ này, lỗi thì tự về Workers AI
# miễn phí. Không cấu hình = mọi ảnh vẽ bằng Workers AI, 0 đồng.

# Khoá cửa ngân hàng. KHÔNG để ở đây — đây là tệp nằm trong kho mã.
# Nạp bằng:  npx wrangler secret put GITA_KHOA_NGANHANG
#
# Khoá này chỉ mở ĐÚNG MỘT việc: đẩy một dòng sao kê vào. Nó không mở
# được bất kỳ cửa nào khác, nên lộ nó không mất dữ liệu khách — nhưng
# người cầm nó ghi được những dòng ngân hàng giả, và bản đối chiếu là
# thứ duy nhất trong hệ đứng ngoài. Giữ nó như giữ khoá két.

# Workers AI — bộ não miễn phí của xưởng phim 0 đồng (10.000 neuron/ngày
# không mất tiền; máy chủ tự dừng ở GITA_PHIM_TRAN_NEURON).
[ai]
binding = "AI"

# HAI KHUNG GIỜ, HAI VIỆC KHÁC NHAU.
#
#   20:00 UTC = 03:00 sáng giờ Việt Nam — DỌN. Giờ chết, không ai dùng.
#   00:00 UTC = 07:00 sáng giờ Việt Nam — BẢN TỔNG DOANH THU ngày hôm
#               qua. Thư nằm sẵn trong hòm lúc chủ hệ mở máy, và ngày
#               hôm qua lúc ấy đã đóng hẳn.
#
# Bộ chạy theo giờ nhận CẢ HAI lần nổ; nó tự phân theo giờ UTC trong
# worker.js. Thiếu dòng 00:00 ở đây thì bản tổng KHÔNG BAO GIỜ gửi, mà
# mã vẫn trông như đã làm xong việc — đúng lớp lỗi im lặng nhất.
[triggers]
crons = ["0 20 * * *", "0 0 * * *", "0,5,10,15,20,25 * * * *"]

# Nguồn dữ liệu. Tạo bằng:  npx wrangler d1 create gita365
# rồi dán database_id vào đây (id KHÔNG phải bí mật — nó chỉ định danh).
[[d1_databases]]
binding = "CSDL"
database_name = "gita365"
database_id = "8ce5271b-be05-47cb-bc34-d25c9e0436d8"

# Kho tệp cho RUỘT hồ sơ người dùng.
#
# Vì sao ruột không nằm trong D1: nửa triệu hồ sơ × 50 KB là 25 GB,
# quá sức D1 (trần 10 GB) và vừa vặn kho tệp (10 GB đầu miễn phí).
# Xem chú giải ở bảng hosoApp trong csdl.sql.
[[r2_buckets]]
binding = "HOSO"
bucket_name = "gita365-hoso"

# ── VỆ CHI PHÍ (may-chu/ve-chi-phi.js) — xem docs/TOI_UU_CHI_PHI_CHAT_LUONG.md ──
# Tầng 1 (đếm trong bộ nhớ isolate) luôn chạy, không cần khai gì.
# Tầng 2 TUỲ CHỌN: Rate Limiting binding của Cloudflare — đếm ở mạng biên,
# không tốn lượt D1. Bỏ dấu # ba khối dưới để bật (namespace_id là số
# nguyên tự chọn, duy nhất trong tài khoản). Không khai thì mã tự bỏ qua.
# BẬT từ 10/10/2026. Tầng 1 đếm trong bộ nhớ TỪNG isolate — kẻ dội yêu cầu
# rơi vào nhiều isolate khác nhau thì mỗi nơi đếm lại từ 0. Tầng 2 đếm
# chung ở mạng biên nên chặn được. Binding hỏng thì mã KHÔNG chặn người thật.
[[ratelimits]]
name = "GIOI_HAN"
namespace_id = "3650"
simple = { limit = 300, period = 60 }
#
# Chế độ tiết kiệm: khi bảng Cloudflare báo sắp chạm hạn mức miễn phí,
# đặt GITA_CHE_DO_TIET_KIEM = "1" ở [vars] (hoặc Dashboard → Settings →
# Variables) để tạm đóng các việc gọi AI tính tiền theo lượt.
#
# ── KHOANG (may-chu/khoang.js) — khoá TỪNG PHẦN thay vì đóng băng cả hệ ──
# GITA_KHOA_KHOANG = "ai,phim"  (Dashboard → Settings → Variables) khoá ngay
# các khoang ấy mà không cần D1 hay đăng nhập. "*" = khoá mọi khoang trừ
# đăng nhập và cứu hệ. Khoang: dongbo ai phim crm taichinh thigiac
# congdong noidung taikhoan khac cua. Bình thường để trống.
#
# GITA_GIU_SAO_LUU = "5"  — số bản sao lưu hồ sơ giữ mỗi người (3–30, mặc
# định 10). Hạ xuống 5 khi R2 vượt 8 GB để ở lại hạn miễn phí 10 GB.
# GITA_SAO_LUU_PHUT = "4320" — khoảng cách tối thiểu giữa hai bản sao lưu
# (phút, mặc định 30). Đặt 4320 từ ~200k tài khoản để ghi D1 và R2 lớp A
# ở dưới hạn miễn phí. Đổi lại: điểm khôi phục thưa hơn (tối đa 3 ngày);
# bản sao offline hằng đêm trên Windows bù phần này (docs/KIEN_TRUC_NOI_LUC.md).

# ═══════════════════════════════════════════════════════════════
#  BỐN BÍ MẬT — KHÔNG BAO GIỜ VIẾT VÀO TỆP NÀY
#
#  Tệp này nằm trong kho mã. Kho mã đi qua git, qua máy người khác, qua
#  màn hình lúc chia sẻ. Một bí mật viết vào đây là một bí mật đã lộ từ
#  dòng đầu tiên nó được viết ra — cùng đúng cái luật mà máy chủ cũ đã
#  ghi ở đầu GITA365_TATCA.gs về mật khẩu nằm cứng trong mã.
#
#  Nạp bằng lệnh, mỗi lệnh hỏi giá trị rồi cất vào kho bí mật của
#  Cloudflare:
#
#    npx wrangler secret put GITA_TIEU
#        Tiêu băm mật khẩu. Sinh MỘT LẦN rồi giữ mãi:
#            node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#        ĐỔI TIÊU LÀ MỌI MẬT KHẨU HỎNG CÙNG LÚC — không ai đăng nhập
#        được nữa và không có đường lùi. Cất một bản ở nơi an toàn.
#
#    npx wrangler secret put GITA_KHOA_KHO
#        Nội dung kho/khoa.json. Đây là chìa mở toàn bộ tài sản nội
#        dung của Học viện. Không nằm trong cơ sở dữ liệu — một bản sao
#        lưu cơ sở dữ liệu bị lộ mà kéo theo bộ khoá thì mất tất cả,
#        chứ không phải mất dữ liệu một người.
#
#    npx wrangler secret put GITA_KHOA_KY
#        Khoá ký chứng cứ hoa hồng (HMAC). Chưa dùng tới ở phần đã
#        port; nạp sẵn để lúc port GITA_ChungCu.gs không phải quay lại.
#
#    npx wrangler secret put GITA_KHOA_THU
#
# ── CẦU NỐI GMAIL (đường gửi thư chính khi chưa có tên miền riêng) ──
# Apps Script ở may-chu/cau-noi-gmail/Code.gs, chạy dưới tài khoản
# typhuquanggita@gmail.com. Có đủ hai secret này thì mọi thư (OTP, lấy
# lại mật khẩu, báo doanh thu…) đi qua Gmail trước; hỏng thì thử Resend.
#    npx wrangler secret put GITA_CAU_NOI_GMAIL   # URL .../exec của Apps Script
#    npx wrangler secret put GITA_KHOA_CAU_NOI    # trùng thuộc tính KHOA ở Apps Script
# ── XƯỞNG PHIM TỰ ĐỘNG A-Z (9.99.251, may-chu/phim-ai.js) ──
# Khoá API fal.ai của chủ hệ (fal.ai/dashboard/keys). Thiếu thì ba cửa
# phimGuiViec/phimXemViec/phimTrangThai báo "chưa có khoá"; chỉ R01 dùng.
# Đặt ở GitHub secret GITA_KHOA_FAL thì workflow deploy tự nạp, hoặc:
#    npx wrangler secret put GITA_KHOA_FAL
# ── CỬA ĐI RA NGOÀI (tuỳ chọn — TẮT SẴN) ──
# Chủ hệ chốt ở 9.99.11: được phép nối một bộ tạo ảnh bên ngoài.
# Thiếu MỘT trong hai thì cửa ĐÓNG, và máy chủ nói rõ là đóng chứ không
# im lặng trả về như đã gửi. Đây là mặc định cố ý: nối một bộ vẽ bên
# ngoài là một quyết định phải bấm, không phải một thứ có sẵn.
# Thứ đi ra là ĐÚNG NĂM TRƯỜNG của đề bài — nội dung KHÔNG bao giờ đi ra.
#    npx wrangler secret put GITA_KHOA_VE
#    npx wrangler secret put GITA_CONG_VE
#
# ── VẼ NHƯ CHATGPT (9.99.40) ──
# ChatGPT vẽ ảnh bằng API ảnh của OpenAI — một cửa HTTP mua được. Bộ
# chuyển đổi đã có sẵn trong mã, nên chỉ cần khai KIỂU cổng:
#    npx wrangler secret put GITA_KIEU_VE    -> openai   (hoặc gita)
#    npx wrangler secret put GITA_MAU_VE     -> tên mô hình ảnh
# Với kiểu `openai`: GITA_CONG_VE là đường dẫn tạo ảnh của OpenAI, và
# GITA_KHOA_VE là khoá API tài khoản OpenAI của Học viện.
# Không khai GITA_KIEU_VE thì mặc định `gita` — dạng riêng, dành cho ai
# tự dựng một lớp trung gian.
#
# ── SOẠN BẢN NHÁP VĂN BẢN NGOÀI (XU-02 · TẮT SẴN) ──
# Chỉ Super Admin gọi được, chỉ sau khi quyền AI02 được bật và qua cổng
# soatRaNhaCungCap (PII bị chặn). Gửi duy nhất đề bài đã nhập; không gửi
# hồ sơ khách hay khoá học. Kết quả chỉ là bản nháp, không tự lưu/phát hành.
# Cổng cố định OpenAI API; không cấu hình URL tùy ý để tránh SSRF.
#    npx wrangler secret put GITA_AI_KHOA
#    npx wrangler secret put GITA_AI_MAU
#
# ── BỘ NÃO ĐA TRÍ (bo-nao-da-tri.js · TẮT SẴN) ──
# Định tuyến 5 bậc: đệm D1 (0 token) → Workers AI → DeepSeek → Gemini/GPT
# → Claude/Grok (chỉ Super Admin). Mọi lượt qua soatRaNhaCungCap (Điều 13).
# Bật cửa (biến thường, không bí mật):
#    GITA_DA_TRI_BAT = "1"            (đặt ở Dashboard › Settings › Variables)
# Bậc 1 miễn phí — mở khối [ai] ở dưới cùng tệp này.
# Mỗi nhà cung cấp chỉ chạy khi có khoá; nhà nào không có khoá coi như vắng:
#    npx wrangler secret put GITA_KHOA_DEEPSEEK
#    npx wrangler secret put GITA_KHOA_GEMINI
#    npx wrangler secret put GITA_KHOA_OPENAI
#    npx wrangler secret put GITA_KHOA_ANTHROPIC  + GITA_MAU_ANTHROPIC (bắt buộc)
#    npx wrangler secret put GITA_KHOA_XAI        + GITA_MAU_XAI       (bắt buộc)
# Ngân sách token mỗi ngày (tuỳ chọn, ghi đè mặc định trong NCC):
#    GITA_NGAN_TOKEN_DEEPSEEK · _GEMINI · _OPENAI · _ANTHROPIC · _XAI
# Trần tải: chỉ dùng tối đa GITA_TRAN_TAI % ngân sách trên (mặc định 50).
#    GITA_TRAN_TAI = "50"   → nửa còn lại là dự phòng, không bao giờ chạm đáy.
# Tự điều chỉnh có biên: nhà cung cấp bị chấm "chưa tốt" >70% (≥10 lượt) cho
# một loại việc thì xếp cuối hàng loại đó (không loại hẳn). Mặc định bật.
#    GITA_TU_DIEU_CHINH = "0"  → tắt, về thứ tự gốc (docs/LA_CHAN_30_TANG.md).
# Kho giải pháp + canh mô hình mới (lịch chạy, tối đa 1 lần/7 ngày, chỉ báo,
# không tự đổi GITA_MAU_*) chạy sẵn khi GITA_DA_TRI_BAT = "1".
# GITA_CHE_DO_TIET_KIEM = "1" → chỉ còn đệm + Workers AI.
#
# LƯU Ý MỘT CHỖ HAY BỊ HỎI: mô hình NGÔN NGỮ (loại đang chạy trợ lý
# này) ĐỌC được ảnh nhưng KHÔNG sinh ra ảnh. Ảnh người như ảnh chụp là
# việc của mô hình KHUẾCH TÁN, một loại máy khác. Không có công tắc nào
# trong kho mã bật được nó lên — nó là thứ mua tài khoản.
#        Khoá của nhà gửi thư (mặc định Resend). Mã xác nhận đăng ký và
#        mã lấy lại mật khẩu đi bằng khoá này — không có nó thì luồng
#        đăng ký dừng ở bước một và NÓI RA, chứ không im lặng báo "đã
#        gửi mã" cho một lá thư không đi.
#
#        VÌ SAO KHÔNG GỬI QUA GMAIL NHƯ NỀN CŨ: Gmail thường cho 100
#        thư/ngày, Workspace 1.500–2.000. Ở 100.000 tài khoản, riêng mã
#        đăng ký và mã lấy lại mật khẩu đã vượt trong một ngày bình
#        thường — và hết hạn ngày là hết SẠCH, mã của khách hàng thật
#        ngừng gửi tới nửa đêm mà không có gì báo trước.
#
#        Chi phí: Resend miễn phí 3.000 thư/tháng, rồi khoảng 20 đô cho
#        50.000 thư. CHỦ HỆ NÊN NHÌN CON SỐ NÀY TRƯỚC KHI TRIỂN KHAI.
#        Đổi sang Mailgun/SendGrid/SES là viết một hàm cùng chữ ký với
#        guiQuaResend_ trong may-chu/thu.js — đúng một chỗ.
#
#  ═══════════════ NĂM VIỆC LÚC TRIỂN KHAI ═══════════════
#
#  1. npx wrangler d1 create gita365          → dán database_id lên trên
#  2. npx wrangler d1 execute gita365 --file=csdl.sql --remote
#  3. bốn lệnh secret put ở trên
#  4. Gửi thư — làm MỘT trong hai:
#     a) (chưa có tên miền riêng — HIỆN DÙNG) dựng cầu nối Gmail theo
#        hướng dẫn đầu tệp may-chu/cau-noi-gmail/Code.gs rồi nạp hai
#        secret GITA_CAU_NOI_GMAIL + GITA_KHOA_CAU_NOI. Hạn mức khoảng
#        100 người nhận/ngày.
#     b) (khi đã có tên miền) đặt GITA_THU_GUI_TU ở [vars] và xác thực
#        tên miền ấy ở Resend (SPF + DKIM): thêm vài bản ghi TXT/CNAME
#        vào DNS rồi bấm xác thực. KHÔNG BỎ QUA bước xác thực — thư vẫn đi
#     nhưng rơi vào mục spam, mà một mã xác nhận nằm trong mục spam thì
#     đúng bằng không gửi, và người dùng chỉ thấy "mã không tới".
#     Kiểm: đăng nhập Super Admin, gọi fn "thuGuiThu" — thư thử tới
#     GITA_THU_TRA_LOI.
#
#     Bản web chạy ở https://gita365.pages.dev, máy chủ ở
#     https://gita365.typhuquanggita.workers.dev — khác origin, nên
#     GITA_DIA_CHI_WEB ở trên phải chứa địa chỉ web để CORS cho qua.
#  5. npx wrangler deploy
#
#  Rồi trong ứng dụng: Super Admin → Quản trị trang → Nối máy chủ →
#  dán địa chỉ Worker → Lưu → Gọi thử.
#
#  ĐỔI ĐỊA CHỈ LÀ ĐỔI NỀN, VÀ ĐỔI NGƯỢC LẠI ĐƯỢC TRONG MỘT PHÚT. Cửa
#  vào mới giữ nguyên bề mặt của máy chủ cũ đúng để làm được việc ấy:
#  hai máy chủ cùng chạy một thời gian, có chuyện thì dán lại địa chỉ
#  cũ. Đổi bề mặt cùng lúc với đổi nền thì lúc hỏng không ai biết hỏng
#  vì nền hay vì bề mặt.
# ═══════════════════════════════════════════════════════════════

